name: Package Integration Tests

on:
  workflow_call:
    inputs:
      command:
        description: "The command to run for running the package integration tests."
        required: false
        type: string
        default: task test:integration
      k8s_version:
        description: "The Kubernetes version to use for running the package integration tests."
        required: false
        type: string
        default: v1.36

permissions:
  contents: read

env:
  HOMEBREW_NO_SANDBOX_LINUX: 1

jobs:
  test-integration:
    name: Integration Tests on ${{ inputs.k8s_version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Build devenv shell
        run: devenv test
      
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # master
      
      - name: Install kctrl
        run: |
          brew trust carvel-dev/carvel
          brew tap carvel-dev/carvel
          brew install kctrl
      
      - name: Run integration tests
        shell: devenv shell bash -- -e {0}
        env:
          K8S_VERSION: ${{ inputs.k8s_version }}
        run: ${{ inputs.command }}
