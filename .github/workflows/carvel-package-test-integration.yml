name: Package Integration Tests

on:
  workflow_call:
    inputs:
      command:
        description: "The command to run for running the package integration tests."
        required: false
        type: string
        default: task test:integration
      k8s_version:
        description: "The Kubernetes version to use for running the package integration tests."
        required: false
        type: string
        default: v1.35

permissions:
  contents: read

env:
  FLOX_DISABLE_METRICS: true
  HOMEBREW_NO_SANDBOX_LINUX: 1

jobs:
  test-integration:
    name: Integration Tests on ${{ inputs.k8s_version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Flox
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3
      
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac # master
      
      - name: Install kctrl
        run: |
          brew trust carvel-dev/carvel
          brew tap carvel-dev/carvel
          brew install kctrl
      
      - name: Run integration tests
        uses: flox/activate-action@7065dcbe5583b7b015f07a8ebd49d7266e3053e8 # v1.1.1
        env:
          K8S_VERSION: ${{ inputs.k8s_version }}
        with:
          command: ${{ inputs.command }}
